<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nonograms</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main>
      <section class="game">
        <div class="game__container">
          <div class="col-hints">
            <div class="col-hints__items">
              <div class="col-hints__item">1</div>
              <div class="col-hints__item">1</div>
              <div class="col-hints__item">1</div>
            </div>
            <div class="col-hints__items">0</div>
            <div class="col-hints__items">0</div>
            <div class="col-hints__items">0</div>
            <div class="col-hints__items">0</div>
          </div>
          <div class="game__wrapper">
            <div class="row-hints">
              <div class="row-hints__items">
                <div class="row-hints__item">1</div>
                <div class="row-hints__item">1</div>
                <div class="row-hints__item">1</div>
              </div>
              <div class="row-hints__items">0</div>
              <div class="row-hints__items">0</div>
              <div class="row-hints__items">0</div>
              <div class="row-hints__items">0</div>
            </div>

            <div class="game__table">
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
              <div class="game__table-ceil"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="game__controle">
        <div class="game__container">
          <button type="button" class="read-size">
            Получить текущий уровень!
          </button>
          <select class="size" name="size">
            <option value="easy">size 5</option>
            <option value="medium">size 10</option>
            <option value="hard">size 15</option>
          </select>
        </div>
      </section>
    </main>

    <script type="module" src="./js/script.js"></script>
  </body>
</html>
