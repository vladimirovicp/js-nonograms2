<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nonograms</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main>
      <section class="game">
        <div class="game__container">
          <div class="col-hints">
            <div class="col-hints__items">
              <div class="col-hints__item">1</div>
            </div>
            <div class="col-hints__items">
              <div class="col-hints__item">3</div>
            </div>
            <div class="col-hints__items">
              <div class="col-hints__item">5</div>
            </div>
            <div class="col-hints__items">
              <div class="col-hints__item">1</div>
              <div class="col-hints__item">1</div>
            </div>
            <div class="col-hints__items">
              <div class="col-hints__item">5</div>
            </div>
          </div>
          <div class="game__wrapper">
            <div class="row-hints">
              <div class="row-hints__items">
                <div class="row-hints__item">3</div>
              </div>
              <div class="row-hints__items">
                <div class="row-hints__item">2</div>
                <div class="row-hints__item">1</div>
              </div>
              <div class="row-hints__items">
                <div class="row-hints__item">5</div>
              </div>
              <div class="row-hints__items">
                <div class="row-hints__item">2</div>
                <div class="row-hints__item">1</div>
              </div>
              <div class="row-hints__items">
                <div class="row-hints__item">3</div>
              </div>
            </div>
            <div class="game__table">
              <div class="game__table-ceil" data-col="0" data-row="0"></div>
              <div class="game__table-ceil" data-col="0" data-row="1"></div>
              <div class="game__table-ceil" data-col="0" data-row="2"></div>
              <div class="game__table-ceil" data-col="0" data-row="3"></div>
              <div class="game__table-ceil" data-col="0" data-row="4"></div>
              <div class="game__table-ceil" data-col="1" data-row="0"></div>
              <div class="game__table-ceil" data-col="1" data-row="1"></div>
              <div class="game__table-ceil" data-col="1" data-row="2"></div>
              <div class="game__table-ceil" data-col="1" data-row="3"></div>
              <div class="game__table-ceil" data-col="1" data-row="4"></div>
              <div class="game__table-ceil" data-col="2" data-row="0"></div>
              <div class="game__table-ceil" data-col="2" data-row="1"></div>
              <div class="game__table-ceil" data-col="2" data-row="2"></div>
              <div class="game__table-ceil" data-col="2" data-row="3"></div>
              <div class="game__table-ceil" data-col="2" data-row="4"></div>
              <div class="game__table-ceil" data-col="3" data-row="0"></div>
              <div class="game__table-ceil" data-col="3" data-row="1"></div>
              <div class="game__table-ceil" data-col="3" data-row="2"></div>
              <div class="game__table-ceil" data-col="3" data-row="3"></div>
              <div class="game__table-ceil" data-col="3" data-row="4"></div>
              <div class="game__table-ceil" data-col="4" data-row="0"></div>
              <div class="game__table-ceil" data-col="4" data-row="1"></div>
              <div class="game__table-ceil" data-col="4" data-row="2"></div>
              <div class="game__table-ceil" data-col="4" data-row="3"></div>
              <div class="game__table-ceil" data-col="4" data-row="4"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
